name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/express-reader/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: plugins/express-reader
        run: pnpm install --frozen-lockfile
      - name: Check syntax
        working-directory: plugins/express-reader
        run: pnpm run check
      - name: Run tests
        working-directory: plugins/express-reader
        run: pnpm test
      - name: Run browser smoke test
        working-directory: plugins/express-reader
        run: pnpm run test:browser
      - name: Run MCP smoke test
        working-directory: plugins/express-reader
        run: pnpm run test:mcp
